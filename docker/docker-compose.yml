services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: gridmind
      POSTGRES_DB: gridmind
    ports:
      - "5432:5432"
    volumes:
      - gridmind_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 文档解析独立服务（CPU）；应用通过 DOCLING_SERVE_URL 调用，不装 Python docling 包
  docling:
    image: quay.io/docling-project/docling-serve-cpu
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"

volumes:
  gridmind_pg:
