services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: gridmind
      POSTGRES_DB: gridmind
    ports:
      - "5432:5432"
    volumes:
      - gridmind_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  gridmind_pg:
