[project]
name = "gridmind"
version = "0.1.0"
description = "GridMind — 电网智能问答与数据分析平台（Agent + MCP + NL2SQL ChatBI 学习项目）"
readme = "README.md"
authors = [
    { name = "王新勇(Tacey Wong)", email = "xinyong.w@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pydantic-settings>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "sqlglot>=25.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
    "litellm>=1.106.6",
    "openai>=2.54.0",
    "llama-index-core>=0.14.25",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "llama-index-embeddings-huggingface>=0.5",
    "llama-index-llms-openai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
gridmind = "gridmind:main"

[tool.fastapi]
entrypoint = "gridmind.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.11.0",
]
