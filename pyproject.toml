[project]
name = "gridmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "王新勇(Tacey Wong)", email = "xinyong.w@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
]

[project.scripts]
gridmind = "gridmind:main"

[tool.fastapi]
entrypoint = "gridmind.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
